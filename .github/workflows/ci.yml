name: ci
permissions:
  contents: read
on:
  push:
    branches: [main, "rsh/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node-version == 22
        run: npm pack --dry-run
      - name: Black-box install and workspace lifecycle
        if: matrix.node-version == 22
        run: |
          PKG=$(npm pack --silent)
          TMP=$(mktemp -d)
          cd "$TMP"
          npm install "$GITHUB_WORKSPACE/$PKG" --silent
          printf '%s\n' '# CI Intent' '' 'Preserve the packaged 0.1.5 memory contract.' > INTENT.md
          ./node_modules/.bin/rsh init INTENT.md
          printf '%s\n' '+++' 'kind = "finding"' 'title = "Packaged memory path"' 'summary = "The installed CLI preserves one reusable conclusion."' 'scope = "packaged smoke test"' '+++' '# CI result' '' 'The packaged remember path works.' | ./node_modules/.bin/rsh remember -
          MEMORY_ID=$(basename "$(find .rsh/records -name 'R-*.md' -print -quit)" .md)
          printf '%s\n' '+++' 'kind = "finding"' 'title = "Corrected packaged memory"' 'summary = "The installed CLI replaces the named durable conclusion."' 'scope = "packaged smoke test"' '+++' '# Corrected CI result' '' 'The packaged correction path works.' | ./node_modules/.bin/rsh correct "$MEMORY_ID" -
          ./node_modules/.bin/rsh read "$MEMORY_ID"
          ./node_modules/.bin/rsh brief
          ./node_modules/.bin/rsh search 'packaged memory'
