name: ci
permissions:
  contents: read
on:
  push:
    branches: [main, "rsh/**"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npm run check
      - if: matrix.node-version == 22
        run: npm pack --dry-run
      - name: Black-box install and workspace lifecycle
        if: matrix.node-version == 22
        run: |
          PKG=$(npm pack --silent)
          TMP=$(mktemp -d)
          cd "$TMP"
          git init -q
          npm install "$GITHUB_WORKSPACE/$PKG" --silent
          ./node_modules/.bin/rsh init
          printf '%s\n' '+++' 'kind = "result"' 'state = "unchecked"' '+++' '' '# CI result' '' 'The packaged checkpoint path works.' | ./node_modules/.bin/rsh checkpoint -
          ./node_modules/.bin/rsh resume
          ./node_modules/.bin/rsh find 'CI result'
          ./node_modules/.bin/rsh status
          ./node_modules/.bin/rsh doctor
